[project]
name = "plur"
version = "0.1.0"
requires-python = ">=3.11.12"
dependencies = [
    "django>=5.2",
    "django-ninja>=1.6.2",
    "psycopg>=3.1",
    "httpx>=0.27",
    "loguru>=0.7",
    "gunicorn>=22.0",
    "uvicorn[standard]>=0.30",
    "python-decouple>=3.8",
    "dj-database-url>=2.0",
    "django-cors-headers>=4.3",
    "pyjwt>=2.8",
    "pillow>=10.0",
    "django-anymail[resend]>=14.0",
    "web3>=7.14.1",
    "eth-account>=0.13.7",
    "whitenoise>=6.12.0",
    "google-genai>=1.0",
    "cloudinary>=1.40",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "factory-boy>=3.3",
    "respx>=0.21",
    "django-extensions>=3.2",
    "pre-commit>=3.7",
    "ruff>=0.4",
    "bandit[toml]>=1.7",
    "detect-secrets>=1.5",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "UP",    # pyupgrade
    "N",     # pep8-naming
    "SIM",   # flake8-simplify
    "TCH",   # flake8-type-checking
    "ANN",   # flake8-annotations (typing enforcement)
    "ASYNC", # flake8-async (async-specific rules)
    "S",     # flake8-bandit (security)
    "DJ",    # flake8-django
    "PT",    # flake8-pytest-style
    "RUF",   # Ruff-specific rules
]
ignore = [
    "S101",   # Use of assert (OK in tests)
    "S104",   # Binding to all interfaces (needed for Docker)
]

[tool.ruff.lint.per-file-ignores]
"*/tests/*" = ["ANN", "S"]
"*/migrations/*" = ["ALL"]
"manage.py" = ["ANN"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "core", "config"]
force-sort-within-sections = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.bandit]
exclude_dirs = ["tests", "migrations"]
skips = ["B101"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.development"
asyncio_mode = "auto"
pythonpath = ["."]
