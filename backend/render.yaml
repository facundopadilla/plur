services:
  - type: web
    name: plur-api
    runtime: python
    buildCommand: "uv sync --frozen"
    startCommand: "uv run gunicorn config.asgi:application -k uvicorn.workers.UvicornWorker --workers 2 --bind 0.0.0.0:$PORT"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: PYTHON_VERSION
        value: 3.11.12
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: plur-api.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: plur-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: plur-redis
          type: redis
          property: connectionString

databases:
  - name: plur-db
    plan: free
    databaseName: plur
    user: plur

  - name: plur-redis
    plan: free
