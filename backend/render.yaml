services:
  - type: web
    name: plur-api
    runtime: python
    rootDir: backend
    buildCommand: "uv sync --frozen && uv run python manage.py collectstatic --noinput && uv run python manage.py migrate --noinput"
    startCommand: "uv run gunicorn config.asgi:application -k uvicorn.workers.UvicornWorker --workers 2 --bind 0.0.0.0:$PORT"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: PYTHON_VERSION
        value: 3.11.12
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: AVALANCHE_BACKEND_PRIVATE_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
