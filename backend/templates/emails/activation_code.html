<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Activá tu cuenta — Plur</title>
</head>
<body style="margin:0;padding:0;background:#0a0a0a;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background:#0a0a0a;padding:40px 20px;">
    <tr>
      <td align="center">
        <table width="560" cellpadding="0" cellspacing="0" style="max-width:560px;width:100%;">
          <!-- Logo -->
          <tr>
            <td style="padding-bottom:32px;">
              <span style="font-size:22px;font-weight:800;letter-spacing:0.1em;text-transform:uppercase;color:#ffffff;">
                PLUR<span style="color:#c8ff00;">.</span>
              </span>
            </td>
          </tr>
          <!-- Body -->
          <tr>
            <td style="background:#111111;padding:40px;border:1px solid #222222;">
              <p style="margin:0 0 8px;font-size:13px;color:#888888;text-transform:uppercase;letter-spacing:0.1em;">Activación de cuenta</p>
              <h1 style="margin:0 0 24px;font-size:24px;font-weight:700;color:#ffffff;line-height:1.3;">
                Hola, {{ first_name }}
              </h1>
              <p style="margin:0 0 32px;font-size:15px;color:#aaaaaa;line-height:1.6;">
                Usá el siguiente código para activar tu cuenta en Plur.
                El código es válido por 24 horas.
              </p>
              <!-- Code block -->
              <table width="100%" cellpadding="0" cellspacing="0">
                <tr>
                  <td align="center" style="background:#1a1a1a;border:1px solid #333333;padding:28px;">
                    <span style="font-size:40px;font-weight:800;letter-spacing:12px;color:#c8ff00;font-family:monospace;">
                      {{ code }}
                    </span>
                  </td>
                </tr>
              </table>
              <p style="margin:32px 0 0;font-size:13px;color:#555555;line-height:1.6;">
                Si no creaste una cuenta en Plur, podés ignorar este email.
              </p>
            </td>
          </tr>
          <!-- Footer -->
          <tr>
            <td style="padding-top:24px;">
              <p style="margin:0;font-size:12px;color:#444444;text-align:center;">
                &copy; 2026 Plur. Todos los derechos reservados.
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
